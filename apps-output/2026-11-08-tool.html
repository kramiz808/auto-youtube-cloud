<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>छात्र साथी - Student Study Tool</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #334155;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 0.2rem;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .nav-container {
            display: flex;
            overflow-x: auto;
            background-color: var(--card-bg);
            padding: 0.5rem;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
            scrollbar-width: none;
        }

        .nav-container::-webkit-scrollbar {
            display: none;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-btn.active {
            background-color: var(--accent);
            color: white;
        }

        main {
            flex: 1;
            padding: 1rem;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        .tool-section {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .tool-section.active {
            display: block;
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        /* Common Elements */
        input, select, textarea {
            width: 100%;
            padding: 0.7rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-color);
            margin-bottom: 0.8rem;
            font-size: 0.95rem;
        }

        button.action-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
        }

        button.action-btn:hover {
            background-color: var(--accent-hover);
        }

        /* 1. Timer */
        .timer-display {
            font-size: 3rem;
            text-align: center;
            font-weight: bold;
            margin: 1.5rem 0;
            color: var(--accent);
            font-family: monospace;
        }

        .timer-controls {
            display: flex;
            gap: 0.5rem;
        }

        /* 2. Quiz */
        .quiz-box {
            margin-bottom: 1rem;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.8rem;
        }

        .option-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            padding: 0.7rem;
            text-align: left;
            color: var(--text-color);
            border-radius: 6px;
            cursor: pointer;
        }

        .option-btn.correct { background-color: var(--success); border-color: var(--success); }
        .option-btn.wrong { background-color: var(--danger); border-color: var(--danger); }

        /* 3. Flashcards */
        .flashcard {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1rem;
            font-size: 1.1rem;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        /* 4. Calculator */
        .calc-display {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            font-size: 1.5rem;
            text-align: right;
            padding: 0.8rem;
            border-radius: 6px;
            margin-bottom: 0.8rem;
            overflow-x: auto;
            font-family: monospace;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }

        .calc-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 1rem;
            font-size: 1.1rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .calc-btn:hover { background-color: var(--border); }

        /* 5. Timetable */
        .timetable-list {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 250px;
            overflow-y: auto;
        }

        .timetable-item {
            background-color: var(--bg-color);
            padding: 0.6rem;
            border-radius: 6px;
            border-left: 4px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1rem;
        }

        /* 6. Notes */
        .notes-area {
            height: 200px;
            resize: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>छात्र साथी (Student Tool)</h1>
        <p>आपकी पढ़ाई का डिजिटल साथी</p>
    </header>

    <div class="nav-container">
        <button class="nav-btn active" onclick="switchTab('timer')">⏱️ टाइमर</button>
        <button class="nav-btn" onclick="switchTab('quiz')">❓ क्विज़</button>
        <button class="nav-btn" onclick="switchTab('flashcards')">📇 फ्लैशकार्ड</button>
        <button class="nav-btn" onclick="switchTab('calculator')">🧮 कैलकुलेटर</button>
        <button class="nav-btn" onclick="switchTab('timetable')">📅 टाइमटेबल</button>
        <button class="nav-btn" onclick="switchTab('notes')">📝 नोट्स</button>
    </div>

    <main>
        <!-- 1. STUDY TIMER -->
        <section id="timer" class="tool-section active">
            <h2>पोमोडोरो स्टडी टाइमर</h2>
            <div class="timer-display" id="timerDisplay">25:00</div>
            <div class="timer-controls">
                <button class="action-btn" onclick="startTimer()" style="background-color: var(--success);">शुरू करें</button>
                <button class="action-btn" onclick="pauseTimer()" style="background-color: var(--danger);">रोकें</button>
                <button class="action-btn" onclick="resetTimer()" style="background-color: var(--text-muted);">रीसेट</button>
            </div>
        </section>

        <!-- 2. QUIZ -->
        <section id="quiz" class="tool-section">
            <h2>क्विज़ (सामान्य ज्ञान)</h2>
            <div id="quizContainer">
                <div class="quiz-box" id="questionText">प्रश्न लोड हो रहा है...</div>
                <div class="options-list" id="optionsList"></div>
            </div>
            <button class="action-btn" id="nextQuizBtn" style="margin-top: 1rem; display: none;" onclick="loadNextQuestion()">अगला प्रश्न</button>
        </section>

        <!-- 3. FLASHCARDS -->
        <section id="flashcards" class="tool-section">
            <h2>फ्लैशकार्ड्स (याद रखने के लिए)</h2>
            <div class="flashcard" id="flashcardElement" onclick="flipCard()">
                सवाल लोड हो रहा है...
            </div>
            <button class="action-btn" onclick="nextCard()">अगلا कार्ड</button>
        </section>

        <!-- 4. CALCULATOR -->
        <section id="calculator" class="tool-section">
            <h2>साधारण कैलकुलेटर</h2>
            <div class="calc-display" id="calcDisplay">0</div>
            <div class="calc-grid">
                <button class="calc-btn" onclick="clearCalc()">C</button>
                <button class="calc-btn" onclick="appendCalc('/')">/</button>
                <button class="calc-btn" onclick="appendCalc('*')">*</button>
                <button class="calc-btn" onclick="appendCalc('-')">-</button>
                <button class="calc-btn" onclick="appendCalc('7')">7</button>
                <button class="calc-btn" onclick="appendCalc('8')">8</button>
                <button class="calc-btn" onclick="appendCalc('9')">9</button>
                <button class="calc-btn" onclick="appendCalc('+')">+</button>
                <button class="calc-btn" onclick="appendCalc('4')">4</button>
                <button class="calc-btn" onclick="appendCalc('5')">5</button>
                <button class="calc-btn" onclick="appendCalc('6')">6</button>
                <button class="calc-btn" onclick="calculateResult()" style="grid-row: span 2; background: var(--accent);">=</button>
                <button class="calc-btn" onclick="appendCalc('1')">1</button>
                <button class="calc-btn" onclick="appendCalc('2')">2</button>
                <button class="calc-btn" onclick="appendCalc('3')">3</button>
                <button class="calc-btn" onclick="appendCalc('0')" style="grid-column: span 2;">0</button>
                <button class="calc-btn" onclick="appendCalc('.')">.</button>
            </div>
        </section>

        <!-- 5. TIMETABLE -->
        <section id="timetable" class="tool-section">
            <h2>दैनिक टाइमटेबल</h2>
            <input type="text" id="taskInput" placeholder="विषय या काम (जैसे: गणित, सुबह 8 बजे)">
            <button class="action-btn" onclick="addTask()">जोड़ें</button>
            <div class="timetable-list" id="taskList"></div>
        </section>

        <!-- 6. NOTES -->
        <section id="notes" class="tool-section">
            <h2>त्वरित नोट्स (ऑटो-सेव)</h2>
            <textarea class="notes-area" id="quickNotes" placeholder="यहाँ अपने नोट्स लिखें... (ये सहेजे रहेंगे)" oninput="saveNotes()"></textarea>
            <p style="font-size: 0.8rem; color: var(--text-muted); text-align: right;" id="noteStatus">ऑटो-सेव्ड</p>
        </section>
    </main>

    <script>
        // Tab Navigation
        function switchTab(tabId) {
            document.querySelectorAll('.tool-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // 1. Timer Logic
        let timeLeft = 25 * 60;
        let timerId = null;
        const timerDisplay = document.getElementById('timerDisplay');

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        function startTimer() {
            if (timerId !== null) return;
            timerId = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerId);
                    timerId = null;
                    alert('समय समाप्त! ब्रेक लें।');
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerId);
            timerId = null;
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = 25 * 60;
            updateTimerDisplay();
        }

        // 2. Quiz Logic
        const quizData = [
            { q: "भारत की राजधानी क्या है?", options: ["मुंबई", "नई दिल्ली", "कोलकाता", "चेन्नई"], correct: 1 },
            { q: "प्रकाश संश्लेषण (Photosynthesis) में कौन सी गैस उपयोग होती है?", options: ["ऑक्सीजन", "नाइट्रोजन", "कार्बन डाइऑक्साइड", "हाइड्रोजन"], correct: 2 },
            { q: "पृथ्वी के सबसे करीब कौन सा ग्रह है?", options: ["मंगल", "शुक्र", "बुध", "बृहस्पति"], correct: 1 },
            { q: "गणित के पिता किसे कहा जाता है?", options: ["आर्किमिडीज़", "पाइथागोरस", "न्यूटन", "आर्यभट्ट"], correct: 0 }
        ];
        let currentQuiz = 0;

        function loadQuiz() {
            if(currentQuiz >= quizData.length) currentQuiz = 0;
            const data = quizData[currentQuiz];
            document.getElementById('questionText').textContent = `प्र. ${currentQuiz + 1}: ${data.q}`;
            const optList = document.getElementById('optionsList');
            optList.innerHTML = '';
            document.getElementById('nextQuizBtn').style.display = 'none';

            data.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(index, data.correct, btn);
                optList.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct, btn) {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((b, idx) => {
                b.disabled = true;
                if(idx === correct) b.classList.add('correct');
                else if(idx === selected) b.classList.add('wrong');
            });
            document.getElementById('nextQuizBtn').style.display = 'block';
        }

        function loadNextQuestion() {
            currentQuiz++;
            loadQuiz();
        }

        // 3. Flashcards Logic
        const flashcardsData = [
            { q: "H2O किसका रासायनिक सूत्र है?", a: "पानी (Water)" },
            { q: "भारत का राष्ट्रीय पशु क्या है?", a: "बाघ (Tiger)" },
            { q: "सौरमंडल का सबसे बड़ा ग्रह कौन सा है?", a: "बृहस्पति (Jupiter)" },
            { q: "संविधान के निर्माता किसे कहा जाता है?", a: "डॉ. बी. आर. अम्बेडकर" }
        ];
        let currentCardIndex = 0;
        let showingAnswer = false;

        function updateFlashcard() {
            showingAnswer = false;
            document.getElementById('flashcardElement').textContent = flashcardsData[currentCardIndex].q;
        }

        function flipCard() {
            showingAnswer = !showingAnswer;
            const card = document.getElementById('flashcardElement');
            card.textContent = showingAnswer ? flashcardsData[currentCardIndex].a : flashcardsData[currentCardIndex].q;
        }

        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % flashcardsData.length;
            updateFlashcard();
        }

        // 4. Calculator Logic
        let calcInput = "";
        function appendCalc(val) {
            calcInput += val;
            document.getElementById('calcDisplay').textContent = calcInput;
        }
        function clearCalc() {
            calcInput = "";
            document.getElementById('calcDisplay').textContent = "0";
        }
        function calculateResult() {
            try {
                calcInput = eval(calcInput).toString();
                document.getElementById('calcDisplay').textContent = calcInput;
            } catch (e) {
                document.getElementById('calcDisplay').textContent = "अमान्य";
                calcInput = "";
            }
        }

        // 5. Timetable Logic
        let tasks = JSON.parse(localStorage.getItem('student_tasks')) || [];

        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            tasks.forEach((task, index) => {
                const div = document.createElement('div');
                div.className = 'timetable-item';
                div.innerHTML = `<span>${task}</span> <button class="delete-btn" onclick="deleteTask(${index})">❌</button>`;
                list.appendChild(div);
            });
            localStorage.setItem('student_tasks', JSON.stringify(tasks));
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            if(input.value.trim() !== '') {
                tasks.push(input.value);
                input.value = '';
                renderTasks();
            }
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            renderTasks();
        }

        // 6. Notes Logic
        function saveNotes() {
            const text = document.getElementById('quickNotes').value;
            localStorage.setItem('student_notes', text);
        }

        window.onload = function() {
            loadQuiz();
            updateFlashcard();
            renderTasks();
            const savedNotes = localStorage.getItem('student_notes');
            if(savedNotes) {
                document.getElementById('quickNotes').value = savedNotes;
            }
        };
    </script>
</body>
</html>
