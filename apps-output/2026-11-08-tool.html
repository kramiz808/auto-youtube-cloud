<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>छात्र साथी - ऑल-इन-वन स्टडी टूल</title>
<style>
  :root {
    --bg-color: #121212;
    --card-bg: #1e1e1e;
    --text-color: #e0e0e0;
    --text-muted: #a0a0a0;
    --accent-color: #bb86fc;
    --accent-hover: #9955e8;
    --danger-color: #cf6679;
    --border-color: #2c2c2c;
    --success-color: #03dac6;
  }
  
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  
  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding-bottom: 70px;
  }
  
  header {
    background-color: var(--card-bg);
    padding: 15px;
    text-align: center;
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  
  header h1 {
    font-size: 1.25rem;
    color: var(--accent-color);
  }
  
  header p {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 3px;
  }
  
  main {
    flex: 1;
    padding: 15px;
    max-width: 600px;
    width: 100%;
    margin: 0 auto;
  }
  
  .tool-section {
    display: none;
    animation: fadeIn 0.3s ease-in-out;
  }
  
  .tool-section.active {
    display: block;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .card {
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }
  
  h2 {
    font-size: 1.1rem;
    margin-bottom: 15px;
    color: var(--accent-color);
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 8px;
  }
  
  /* Common UI Elements */
  input, select, textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    background-color: #2c2c2c;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    color: var(--text-color);
    font-size: 0.95rem;
  }
  
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent-color);
  }
  
  button {
    background-color: var(--accent-color);
    color: #121212;
    border: none;
    padding: 10px 15px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    font-size: 0.95rem;
    transition: background 0.2s;
    margin-bottom: 8px;
  }
  
  button:hover {
    background-color: var(--accent-hover);
  }
  
  button.secondary {
    background-color: transparent;
    color: var(--accent-color);
    border: 1px solid var(--accent-color);
  }
  
  button.secondary:hover {
    background-color: rgba(187, 134, 252, 0.1);
  }
  
  button.danger {
    background-color: var(--danger-color);
    color: #fff;
  }
  
  /* Navigation Bar */
  nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background-color: var(--card-bg);
    border-top: 1px solid var(--border-color);
    display: flex;
    justify-content: space-around;
    padding: 8px 0;
    z-index: 1000;
  }
  
  .nav-item {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.7rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    width: auto;
    margin: 0;
    padding: 0;
  }
  
  .nav-item span {
    font-size: 1.2rem;
    margin-bottom: 2px;
  }
  
  .nav-item.active {
    color: var(--accent-color);
  }
  
  /* 1. Timer */
  .timer-display {
    font-size: 3rem;
    text-align: center;
    font-weight: bold;
    margin: 20px 0;
    color: var(--success-color);
    font-family: monospace;
  }
  
  .timer-btns {
    display: flex;
    gap: 10px;
  }
  
  /* 2. Quiz */
  .quiz-option {
    background-color: #2c2c2c;
    border: 1px solid var(--border-color);
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 8px;
    cursor: pointer;
    text-align: left;
    width: 100%;
    color: var(--text-color);
  }
  
  .quiz-option.correct {
    background-color: rgba(3, 218, 198, 0.2);
    border-color: var(--success-color);
  }
  
  .quiz-option.wrong {
    background-color: rgba(207, 102, 121, 0.2);
    border-color: var(--danger-color);
  }
  
  /* 3. Flashcards */
  .flashcard-box {
    background-color: #252525;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    font-size: 1.1rem;
    cursor: pointer;
    margin-bottom: 15px;
    position: relative;
    user-select: none;
  }
  
  .flashcard-hint {
    position: absolute;
    bottom: 8px;
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  
  .flashcard-controls {
    display: flex;
    gap: 10px;
  }
  
  /* 4. Calculator */
  .calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  
  .calc-display {
    background-color: #121212;
    border: 1px solid var(--border-color);
    font-size: 1.8rem;
    text-align: right;
    padding: 15px;
    border-radius: 6px;
    margin-bottom: 10px;
    grid-column: span 4;
    word-break: break-all;
    font-family: monospace;
    height: 70px;
  }
  
  .calc-btn {
    background-color: #2c2c2c;
    color: var(--text-color);
    font-size: 1.2rem;
    padding: 15px 0;
    margin: 0;
  }
  
  .calc-btn.op {
    background-color: #382c42;
    color: var(--accent-color);
  }
  
  .calc-btn.eq {
    background-color: var(--accent-color);
    color: #121212;
  }
  
  /* 5. Timetable */
  .timetable-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: #252525;
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 8px;
    border-left: 4px solid var(--accent-color);
  }
  
  .timetable-item div span {
    display: block;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  
  /* 6. Notes */
  .note-item {
    background-color: #252525;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 10px;
    border: 1px solid var(--border-color);
    position: relative;
  }
  
  .note-item h4 {
    color: var(--accent-color);
    font-size: 1rem;
    margin-bottom: 4px;
  }
  
  .note-item p {
    font-size: 0.9rem;
    color: var(--text-muted);
    white-space: pre-wrap;
  }
  
  .delete-btn {
    background: none;
    border: none;
    color: var(--danger-color);
    cursor: pointer;
    font-size: 0.8rem;
    width: auto;
    padding: 0;
    margin-top: 8px;
    display: inline-block;
  }
</style>
</head>
<body>

<header>
  <h1 id="header-title">छात्र साथी</h1>
  <p id="header-subtitle">पढ़ाई को बनाएं आसान और मजेदार</p>
</header>

<main>
  <!-- 1. STUDY TIMER -->
  <section id="sec-timer" class="tool-section active">
    <div class="card">
      <h2>⏱️ पोमोडोरो स्टडीタイमर</h2>
      <div style="display:flex; gap:10px; margin-bottom:10px;">
        <button class="secondary" onclick="setTimerMode(25, 5)">पढ़ाई (25m)</button>
        <button class="secondary" onclick="setTimerMode(5, 15)">छोटा ब्रेक (5m)</button>
      </div>
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="timer-btns">
        <button id="timer-start-btn" onclick="toggleTimer()">शुरू करें</button>
        <button class="danger" onclick="resetTimer()">रीसेट</button>
      </div>
    </div>
  </section>

  <!-- 2. QUIZ -->
  <section id="sec-quiz" class="tool-section">
    <div class="card">
      <h2>❓ सामान्य ज्ञान क्विज़</h2>
      <div id="quiz-container">
        <div id="quiz-question-box">
          <p id="quiz-q-text" style="font-weight:500; margin-bottom:15px;"></p>
          <div id="quiz-options"></div>
        </div>
        <div id="quiz-result-box" style="display:none; text-align:center;">
          <p style="font-size: 1.2rem; margin-bottom: 15px;" id="quiz-score-text"></p>
          <button onclick="restartQuiz()">फिर से खेलें</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 3. FLASHCARDS -->
  <section id="sec-flash" class="tool-section">
    <div class="card">
      <h2>⚡ फ़्लैशकार्ड्स (याद रखने की तकनीक)</h2>
      <div class="flashcard-box" id="flashcard" onclick="flipCard()">
        <span id="fc-text">लोड हो रहा है...</span>
        <span class="flashcard-hint">(क्लिक करके पलटें)</span>
      </div>
      <div class="flashcard-controls">
        <button class="secondary" onclick="prevCard()">पिछला</button>
        <button onclick="nextCard()">अगला</button>
      </div>
      <div style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 10px;">
        <input type="text" id="new-fc-q" placeholder="सवाल (Front)">
        <input type="text" id="new-fc-a" placeholder="जवाब (Back)">
        <button onclick="addFlashcard()">नया कार्ड जोड़ें</button>
      </div>
    </div>
  </section>

  <!-- 4. CALCULATOR -->
  <section id="sec-calc" class="tool-section">
    <div class="card">
      <h2>🧮 छात्र कैलकुलेटर</h2>
      <div class="calc-display" id="calc-disp">0</div>
      <div class="calc-grid">
        <button class="calc-btn danger" onclick="calcClear()">C</button>
        <button class="calc-btn op" onclick="calcAppend('/')">÷</button>
        <button class="calc-btn op" onclick="calcAppend('*')">×</button>
        <button class="calc-btn op" onclick="calcAppend('-')">-</button>
        
        <button class="calc-btn" onclick="calcAppend('7')">7</button>
        <button class="calc-btn" onclick="calcAppend('8')">8</button>
        <button class="calc-btn" onclick="calcAppend('9')">9</button>
        <button class="calc-btn op" onclick="calcAppend('+')">+</button>
        
        <button class="calc-btn" onclick="calcAppend('4')">4</button>
        <button class="calc-btn" onclick="calcAppend('5')">5</button>
        <button class="calc-btn" onclick="calcAppend('6')">6</button>
        <button class="calc-btn eq" onclick="calcEval()" style="grid-row: span 2;">=</button>
        
        <button class="calc-btn" onclick="calcAppend('1')">1</button>
        <button class="calc-btn" onclick="calcAppend('2')">2</button>
        <button class="calc-btn" onclick="calcAppend('3')">3</button>
        
        <button class="calc-btn" onclick="calcAppend('0')" style="grid-column: span 2;">0</button>
        <button class="calc-btn" onclick="calcAppend('.')">.</button>
      </div>
    </div>
  </section>

  <!-- 5. TIMETABLE -->
  <section id="sec-time" class="tool-section">
    <div class="card">
      <h2>📅 आज का टाइम टेबल</h2>
      <div style="margin-bottom: 15px;">
        <input type="text" id="tt-subject" placeholder="विषय का नाम (जैसे: गणित)">
        <input type="text" id="tt-time" placeholder="समय (जैसे: 10:00 AM - 11:00 AM)">
        <button onclick="addTimetableItem()">समय सारणी जोड़ें</button>
      </div>
      <div id="timetable-list"></div>
    </div>
  </section>

  <!-- 6. NOTES -->
  <section id="sec-notes" class="tool-section">
    <div class="card">
      <h2>📝 क्विक नोट्स</h2>
      <div style="margin-bottom: 15px;">
        <input type="text" id="note-title" placeholder="नोट शीर्षक...">
        <textarea id="note-body" placeholder="यहाँ अपने नोट्स लिखें..." rows="3"></textarea>
        <button onclick="saveNote()">नोट सेव करें</button>
      </div>
      <div id="notes-list"></div>
    </div>
  </section>
</main>

<nav>
  <button class="nav-item active" onclick="switchTab('timer', this)"><span>⏱️</span>टाइमर्स</button>
  <button class="nav-item" onclick="switchTab('quiz', this)"><span>❓</span>क्विज़</button>
  <button class="nav-item" onclick="switchTab('flash', this)"><span>⚡</span>कार्ड्स</button>
  <button class="nav-item" onclick="switchTab('calc', this)"><span>🧮</span>कैलकुलेटर</button>
  <button class="nav-item" onclick="switchTab('time', this)"><span>📅</span>रूटीन</button>
  <button class="nav-item" onclick="switchTab('notes', this)"><span>📝</span>नोट्स</button>
</nav>

<script>
  // --- Navigation ---
  function switchTab(tabId, el) {
    document.querySelectorAll('.tool-section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    
    document.getElementById('sec-' + tabId).classList.add('active');
    el.classList.add('active');
    
    const titles = {
      'timer': 'पोमोडोरो स्टडी टाइमर',
      'quiz': 'सामान्य ज्ञान क्विज़',
      'flash': 'फ़्लैशकार्ड्स अभ्यास',
      'calc': 'छात्र कैलकुलेटर',
      'time': 'दैनिक टाइम टेबल',
      'notes': 'त्वरित नोट्स'
    };
    document.getElementById('header-subtitle').innerText = titles[tabId];
  }

  // --- 1. Study Timer Logic ---
  let timeLeft = 25 * 60;
  let timerId = null;
  let isRunning = false;

  function updateTimerDisplay() {
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    document.getElementById('timer-display').innerText = `${m < 10 ? '0':''}${m}:${s < 10 ? '0':''}${s}`;
  }

  function toggleTimer() {
    if (isRunning) {
      clearInterval(timerId);
      isRunning = false;
      document.getElementById('timer-start-btn').innerText = "शुरू करें";
    } else {
      isRunning = true;
      document.getElementById('timer-start-btn').innerText = "रोकें";
      timerId = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateTimerDisplay();
        } else {
          clearInterval(timerId);
          isRunning = false;
          alert('समय समाप्त हुआ! अब ब्रेक लें या अगला काम शुरू करें।');
          document.getElementById('timer-start-btn').innerText = "शुरू करें";
        }
      }, 1000);
    }
  }

  function resetTimer() {
    clearInterval(timerId);
    isRunning = false;
    timeLeft = 25 * 60;
    updateTimerDisplay();
    document.getElementById('timer-start-btn').innerText = "शुरू करें";
  }

  function setTimerMode(mins, breakMins) {
    clearInterval(timerId);
    isRunning = false;
    timeLeft = mins * 60;
    updateTimerDisplay();
    document.getElementById('timer-start-btn').innerText = "शुरू करें";
  }

  // --- 2. Quiz Logic ---
  const quizData = [
    { q: "भारत की राजधानी क्या है?", options: ["मुंबई", "नई दिल्ली", "कोलकाता", "चेन्नई"], answer: 1 },
    { q: "पृथ्वी के सबसे नज़दीक कौन सा ग्रह है?", options: ["मंगल", "बुध", "शुक्र", "बृहस्पति"], answer: 2 },
    { q: "गणित में 'Pi' (π) का लगभग मान क्या होता है?", options: ["3.14", "2.17", "1.41", "3.41"], answer: 0 },
    { q: "भारत के प्रथम प्रधानमंत्री कौन थे?", options: ["महात्मा गांधी", "डॉ. राजेंद्र प्रसाद", "जवाहरलाल नेहरू", "सरदार पटेल"], answer: 2 },
    { q: "सौरमंडल का सबसे बड़ा ग्रह कौन सा है?", options: ["शनि", "पृथ्वी", "बृहस्पति", "यूरेनस"], answer: 2 }
  ];
  let currentQ = 0;
  let score = 0;

  function loadQuiz() {
    const qBox = document.getElementById('quiz-question-box');
    const rBox = document.getElementById('quiz-result-box');
    qBox.style.display = 'block';
    rBox.style.display = 'none';

    if (currentQ < quizData.length) {
      const data = quizData[currentQ];
      document.getElementById('quiz-q-text').innerText = `प्रश्नावली (${currentQ + 1}/${quizData.length}): ${data.q}`;
      const optDiv = document.getElementById('quiz-options');
      optDiv.innerHTML = '';
      data.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option';
        btn.innerText = opt;
        btn.onclick = () => selectQuizOption(idx, btn);
        optDiv.appendChild(btn);
      });
    } else {
      qBox.style.display = 'none';
      rBox.style.display = 'block';
      document.getElementById('quiz-score-text').innerText = `शाबाश! आपका स्कोर ${score} / ${quizData.length} है।`;
    }
  }

  function selectQuizOption(selectedIdx, btn) {
    const data = quizData[currentQ];
    const options = document.querySelectorAll('.quiz-option');
    
    options.forEach((o, i) => {
      o.style.pointerEvents = 'none';
      if (i === data.answer) o.classList.add('correct');
      else if (i === selectedIdx) o.classList.add('wrong');
    });

    if (selectedIdx === data.answer) score++;

    setTimeout(() => {
      currentQ++;
      loadQuiz();
    }, 1200);
  }

  function restartQuiz() {
    currentQ = 0;
    score = 0;
    loadQuiz();
  }

  // --- 3. Flashcards Logic ---
  let flashcards = [
    { q: "PHOTOSYNTHESIS क्या है?", a: "पौधों द्वारा सूर्य के प्रकाश से भोजन बनाने की प्रक्रिया।" },
    { q: "Newton's First Law क्या है?", a: "जड़त्व का नियम (Inertia) - वस्तु जैसी है वैसे ही रहना चाहती है जब तक बाहरी बल न लगे।" },
    { q: "H2O रासायनिक सूत्र किसका है?", a: "पानी (Water)" }
  ];
  let fcIndex = 0;
  let isFront = true;

  function renderFlashcard() {
    if(flashcards.length === 0) {
      document.getElementById('fc-text').innerText = "कोई कार्ड नहीं है। नीचे से जोड़ें!";
      return;
    }
    const card = flashcards[fcIndex];
    document.getElementById('fc-text').innerText = isFront ? card.q : card.a;
  }

  function flipCard() {
    if(flashcards.length === 0) return;
    isFront = !isFront;
    renderFlashcard();
  }

  function nextCard() {
    if(flashcards.length === 0) return;
    fcIndex = (fcIndex + 1) % flashcards.length;
    isFront = true;
    renderFlashcard();
  }

  function prevCard() {
    if(flashcards.length === 0) return;
    fcIndex = (fcIndex - 1 + flashcards.length) % flashcards.length;
    isFront = true;
    renderFlashcard();
  }

  function addFlashcard() {
    const q = document.getElementById('new-fc-q').value.trim();
    const a = document.getElementById('new-fc-a').value.trim();
    if(q && a) {
      flashcards.push({q, a});
      document.getElementById('new-fc-q').value = '';
      document.getElementById('new-fc-a').value = '';
      alert('नया फ़्लैशकार्ड जुड़ गया!');
      fcIndex = flashcards.length - 1;
      isFront = true;
      renderFlashcard();
    } else {
      alert('कृपया सवाल और जवाब दोनों भरें।');
    }
  }

  // --- 4. Calculator Logic ---
  let calcValue = "0";

  function updateCalc() {
    document.getElementById('calc-disp').innerText = calcValue;
  }

  function calcAppend(val) {
    if (calcValue === "0" && !['+', '-', '*', '/','.'].includes(val)) {
      calcValue = val;
    } else {
      calcValue += val;
    }
    updateCalc();
  }

  function calcClear() {
    calcValue = "0";
    updateCalc();
  }

  function calcEval() {
    try {
      calcValue = eval(calcValue).toString();
    } catch (e) {
      calcValue = "त्रुटि (Error)";
    }
    updateCalc();
    setTimeout(() => { if(calcValue === "त्रुटि (Error)") { calcValue="0"; updateCalc(); } }, 1500);
  }

  // --- 5. Timetable Logic ---
  let timetable = JSON.parse(localStorage.getItem('student_tt') || '[]');

  function renderTimetable() {
    const list = document.getElementById('timetable-list');
    list.innerHTML = '';
    if(timetable.length === 0) {
      list.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">आज कोई रूटीन सेव नहीं है।</p>';
      return;
    }
    timetable.forEach((item, index) => {
      list.innerHTML += `
        <div class="timetable-item">
          <div>
            <strong>${item.subject}</strong>
            <span>${item.time}</span>
          </div>
          <button class="delete-btn" onclick="deleteTimetable(${index})">हटाएं</button>
        </div>
      `;
    });
  }

  function addTimetableItem() {
    const subject = document.getElementById('tt-subject').value.trim();
    const time = document.getElementById('tt-time').value.trim();
    if(subject && time) {
      timetable.push({subject, time});
      localStorage.setItem('student_tt', JSON.stringify(timetable));
      document.getElementById('tt-subject').value = '';
      document.getElementById('tt-time').value = '';
      renderTimetable();
    } else {
      alert('विषय और समय दोनों भरें।');
    }
  }

  function deleteTimetable(index) {
    timetable.splice(index, 1);
    localStorage.setItem('student_tt', JSON.stringify(timetable));
    renderTimetable();
  }

  // --- 6. Notes Logic ---
  let notes = JSON.parse(localStorage.getItem('student_notes') || '[]');

  function renderNotes() {
    const list = document.getElementById('notes-list');
    list.innerHTML = '';
    if(notes.length === 0) {
      list.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">कोई सेव किया हुआ नोट नहीं है।</p>';
      return;
    }
    notes.forEach((note, index) => {
      list.innerHTML += `
        <div class="note-item">
          <h4>${note.title}</h4>
          <p>${note.body}</p>
          <button class="delete-btn" onclick="deleteNote(${index})">डिलीट करें</button>
        </div>
      `;
    });
  }

  function saveNote() {
    const title = document.getElementById('note-title').value.trim();
    const body = document.getElementById('note-body').value.trim();
    if(title && body) {
      notes.push({title, body});
      localStorage.setItem('student_notes', JSON.stringify(notes));
      document.getElementById('note-title').value = '';
      document.getElementById('note-body').value = '';
      renderNotes();
    } else {
      alert('कृपया शीर्षक और नोट दोनों लिखें।');
    }
  }

  function deleteNote(index) {
    notes.splice(index, 1);
    localStorage.setItem('student_notes', JSON.stringify(notes));
    renderNotes();
  }

  // Initializers
  updateTimerDisplay();
  loadQuiz();
  renderFlashcard();
  renderTimetable();
  renderNotes();
</script>

</body>
</html>
