<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>छात्र साथी - ऑल-इन-वन स्टडी टूल</title>
<style>
  :root {
    --bg-color: #121212;
    --card-bg: #1e1e1e;
    --text-color: #e0e0e0;
    --text-muted: #a0a0a0;
    --accent: #bb86fc;
    --accent-hover: #9a67ea;
    --danger: #cf6679;
    --success: #03dac6;
    --border: #2c2c2c;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    background-color: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 1rem;
    text-align: center;
  }

  header h1 {
    font-size: 1.5rem;
    color: var(--accent);
    margin-bottom: 0.2rem;
  }

  header p {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  nav {
    display: flex;
    overflow-x: auto;
    background-color: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 0.5rem;
    gap: 0.5rem;
    scrollbar-width: none;
  }

  nav::-webkit-scrollbar {
    display: none;
  }

  .nav-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 0.6rem 1rem;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    font-size: 0.9rem;
    font-weight: 500;
    transition: all 0.2s;
  }

  .nav-btn.active {
    background-color: var(--accent);
    color: var(--bg-color);
  }

  main {
    flex: 1;
    padding: 1rem;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }

  .tool-section {
    display: none;
    animation: fadeIn 0.3s ease;
  }

  .tool-section.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card {
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }

  h2 {
    font-size: 1.2rem;
    margin-bottom: 1rem;
    color: var(--accent);
  }

  input, select, textarea {
    width: 100%;
    padding: 0.75rem;
    background-color: var(--bg-color);
    border: 1px solid var(--border);
    color: var(--text-color);
    border-radius: 8px;
    margin-bottom: 0.75rem;
    font-size: 1rem;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  button.btn {
    background-color: var(--accent);
    color: var(--bg-color);
    border: none;
    padding: 0.75rem 1.25rem;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 1rem;
    transition: background 0.2s;
    width: 100%;
    margin-bottom: 0.5rem;
  }

  button.btn:hover {
    background-color: var(--accent-hover);
  }

  button.btn-secondary {
    background-color: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
  }

  button.btn-secondary:hover {
    background-color: rgba(187, 134, 252, 0.1);
  }

  /* Timer */
  .timer-display {
    font-size: 3.5rem;
    text-align: center;
    font-weight: bold;
    margin: 1.5rem 0;
    color: var(--success);
    font-family: monospace;
  }

  .timer-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
  }

  /* Flashcards */
  .flashcard-box {
    background-color: var(--bg-color);
    border: 1px solid var(--border);
    border-radius: 10px;
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1rem;
    font-size: 1.1rem;
    cursor: pointer;
    margin-bottom: 1rem;
    user-select: none;
  }

  /* Quiz */
  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .option-btn {
    background-color: var(--bg-color);
    border: 1px solid var(--border);
    color: var(--text-color);
    padding: 0.75rem;
    border-radius: 8px;
    text-align: left;
    cursor: pointer;
    font-size: 1rem;
  }

  .option-btn.correct {
    background-color: rgba(3, 218, 198, 0.2);
    border-color: var(--success);
  }

  .option-btn.wrong {
    background-color: rgba(207, 102, 121, 0.2);
    border-color: var(--danger);
  }

  /* Calculator */
  .calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.5rem;
  }

  .calc-btn {
    background-color: var(--bg-color);
    border: 1px solid var(--border);
    color: var(--text-color);
    padding: 1rem;
    font-size: 1.2rem;
    border-radius: 8px;
    cursor: pointer;
  }

  .calc-btn:hover {
    background-color: var(--border);
  }

  .calc-display {
    grid-column: span 4;
    background-color: var(--bg-color);
    border: 1px solid var(--border);
    padding: 1rem;
    font-size: 1.5rem;
    text-align: right;
    border-radius: 8px;
    margin-bottom: 0.5rem;
    font-family: monospace;
    overflow-x: auto;
  }

  /* Timetable & Notes */
  .list-item {
    background-color: var(--bg-color);
    border: 1px solid var(--border);
    padding: 0.75rem;
    border-radius: 8px;
    margin-bottom: 0.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .list-item button {
    background: none;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 1rem;
  }

  footer {
    text-align: center;
    padding: 1rem;
    font-size: 0.8rem;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    background-color: var(--card-bg);
  }
</style>
</head>
<body>

<header>
  <h1>छात्र साथी</h1>
  <p>आपका ऑल-इन-वन डिजिटल स्टडी असिस्टेंट</p>
</header>

<nav>
  <button class="nav-btn active" onclick="switchTab('timer')">⏱️ टाइमर</button>
  <button class="nav-btn" onclick="switchTab('quiz')">❓ क्विज़</button>
  <button class="nav-btn" onclick="switchTab('flashcards')">📇 फ्लैशकार्ड</button>
  <button class="nav-btn" onclick="switchTab('calculator')">🧮 कैलकुलेटर</button>
  <button class="nav-btn" onclick="switchTab('timetable')">📅 टाइमटेबल</button>
  <button class="nav-btn" onclick="switchTab('notes')">📝 नोट्स</button>
</nav>

<main>
  <!-- TIMER SECTION -->
  <section id="timer" class="tool-section active">
    <div class="card">
      <h2>पोमोडोरो स्टडी टाइमर</h2>
      <div class="timer-display" id="timerDisplay">25:00</div>
      <div class="timer-controls">
        <button class="btn" id="startTimerBtn" onclick="toggleTimer()">शुरू करें</button>
        <button class="btn btn-secondary" onclick="resetTimer()">रीसेट</button>
      </div>
    </div>
  </section>

  <!-- QUIZ SECTION -->
  <section id="quiz" class="tool-section">
    <div class="card">
      <h2>सामान्य ज्ञान क्विज़</h2>
      <div id="quiz-container">
        <p id="question-text" style="margin-bottom: 1rem; font-size: 1.1rem;"></p>
        <div class="quiz-options" id="options-container"></div>
        <button class="btn" id="next-quiz-btn" style="display:none;" onclick="nextQuestion()">अगला प्रश्न</button>
      </div>
      <div id="quiz-result" style="display:none; text-align: center;">
        <p id="score-text" style="font-size: 1.2rem; margin-bottom: 1rem;"></p>
        <button class="btn" onclick="restartQuiz()">फिर से खेलें</button>
      </div>
    </div>
  </section>

  <!-- FLASHCARDS SECTION -->
  <section id="flashcards" class="tool-section">
    <div class="card">
      <h2>पढ़ाई के फ्लैशकार्ड्स</h2>
      <div class="flashcard-box" id="flashcardBox" onclick="flipCard()">
        <span id="cardContent">फ्लैशकार्ड लोड हो रहा है...</span>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button class="btn btn-secondary" onclick="prevCard()">पछला</button>
        <button class="btn" onclick="nextCard()">अगلا</button>
      </div>
      <div style="margin-top: 1rem;">
        <input type="text" id="newCardQ" placeholder="सवाल (Front)">
        <input type="text" id="newCardA" placeholder="जवाब (Back)">
        <button class="btn" onclick="addCard()">नया कार्ड जोड़ें</button>
      </div>
    </div>
  </section>

  <!-- CALCULATOR SECTION -->
  <section id="calculator" class="tool-section">
    <div class="card">
      <h2>साधारण कैलकुलेटर</h2>
      <div class="calc-grid">
        <div class="calc-display" id="calcDisplay">0</div>
        <button class="calc-btn" onclick="clearCalc()">C</button>
        <button class="calc-btn" onclick="appendCalc('/')">/</button>
        <button class="calc-btn" onclick="appendCalc('*')">×</button>
        <button class="calc-btn" onclick="appendCalc('-')">-</button>
        <button class="calc-btn" onclick="appendCalc('7')">7</button>
        <button class="calc-btn" onclick="appendCalc('8')">8</button>
        <button class="calc-btn" onclick="appendCalc('9')">9</button>
        <button class="calc-btn" onclick="appendCalc('+')">+</button>
        <button class="calc-btn" onclick="appendCalc('4')">4</button>
        <button class="calc-btn" onclick="appendCalc('5')">5</button>
        <button class="calc-btn" onclick="appendCalc('6')">6</button>
        <button class="calc-btn" onclick="calculateResult()" style="grid-row: span 2; background: var(--accent); color: var(--bg-color);">=</button>
        <button class="calc-btn" onclick="appendCalc('1')">1</button>
        <button class="calc-btn" onclick="appendCalc('2')">2</button>
        <button class="calc-btn" onclick="appendCalc('3')">3</button>
        <button class="calc-btn" onclick="appendCalc('0')" style="grid-column: span 2;">0</button>
        <button class="calc-btn" onclick="appendCalc('.')">.</button>
      </div>
    </div>
  </section>

  <!-- TIMETABLE SECTION -->
  <section id="timetable" class="tool-section">
    <div class="card">
      <h2>दैनिक टाइमटेबल</h2>
      <input type="text" id="timeInput" placeholder="समय (जैसे: 10:00 AM - 11:00 AM)">
      <input type="text" id="taskInput" placeholder="विषय / काम (যেমন: गणित की पढ़ाई)">
      <button class="btn" onclick="addTimetableItem()">समय सारणी में जोड़ें</button>
      <div id="timetableList" style="margin-top: 1rem;"></div>
    </div>
  </section>

  <!-- NOTES SECTION -->
  <section id="notes" class="tool-section">
    <div class="card">
      <h2>त्वरित नोट्स (Quick Notes)</h2>
      <input type="text" id="noteTitle" placeholder="नोट का शीर्षक">
      <textarea id="noteContent" rows="4" placeholder="यहाँ अपने नोट्स लिखें..."></textarea>
      <button class="btn" onclick="saveNote()">नोट सेव करें</button>
      <div id="notesList" style="margin-top: 1rem;"></div>
    </div>
  </section>
</main>

<footer>
  <p>&copy; छात्र साथी - सभी अधिकार सुरक्षित</p>
</footer>

<script>
  // Navigation
  function switchTab(tabId) {
    document.querySelectorAll('.tool-section').forEach(sec => sec.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    event.target.classList.add('active');
  }

  // 1. Timer Logic
  let timerInterval;
  let timeLeft = 25 * 60;
  let isRunning = false;

  function updateTimerDisplay() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    document.getElementById('timerDisplay').textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }

  function toggleTimer() {
    const btn = document.getElementById('startTimerBtn');
    if (isRunning) {
      clearInterval(timerInterval);
      btn.textContent = 'शुरू करें';
      isRunning = false;
    } else {
      isRunning = true;
      btn.textContent = 'रोकें';
      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          alert('समय समाप्त! थोड़ा विश्राम करें।');
          isRunning = false;
          btn.textContent = 'शुरू करें';
          timeLeft = 25 * 60;
          updateTimerDisplay();
        }
      }, 1000);
    }
  }

  function resetTimer() {
    clearInterval(timerInterval);
    isRunning = false;
    timeLeft = 25 * 60;
    updateTimerDisplay();
    document.getElementById('startTimerBtn').textContent = 'शुरू करें';
  }

  // 2. Quiz Logic
  const quizData = [
    { q: "भारत की राजधानी क्या है?", options: ["मुंबई", "नई दिल्ली", "कोलकाता", "चेन्नई"], answer: 1 },
    { q: "पृथ्वी के सबसे करीब कौन सा ग्रह है?", options: ["मंगल", "बुध", "शुक्र", "बृहस्पति"], answer: 2 },
    { q: "भारत के प्रथम प्रधानमंत्री कौन थे?", options: ["महात्मा गांधी", "डॉ. राजेंद्र प्रसाद", "जवाहरलाल नेहरू", "सदार पटेल"], answer: 2 },
    { q: "गणित में 'π' (पाई) का लगभग मान क्या होता है?", options: ["3.14", "2.17", "1.41", "3.00"], answer: 0 }
  ];
  let currentQuiz = 0;
  let score = 0;

  function loadQuiz() {
    const q = quizData[currentQuiz];
    document.getElementById('question-text').textContent = `प्र. ${currentQuiz + 1}: ${q.q}`;
    const optContainer = document.getElementById('options-container');
    optContainer.innerHTML = '';
    q.options.forEach((opt, index) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.onclick = () => selectOption(index, btn);
      optContainer.appendChild(btn);
    });
    document.getElementById('next-quiz-btn').style.display = 'none';
  }

  function selectOption(selectedIdx, btn) {
    const q = quizData[currentQuiz];
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(b => b.disabled = true);
    
    if (selectedIdx === q.answer) {
      btn.classList.add('correct');
      score++;
    } else {
      btn.classList.add('wrong');
      buttons[q.answer].classList.add('correct');
    }
    document.getElementById('next-quiz-btn').style.display = 'block';
  }

  function nextQuestion() {
    currentQuiz++;
    if (currentQuiz < quizData.length) {
      loadQuiz();
    } else {
      document.getElementById('quiz-container').style.display = 'none';
      document.getElementById('quiz-result').style.display = 'block';
      document.getElementById('score-text').textContent = `आपका स्कोर: ${score} / ${quizData.length}`;
    }
  }

  function restartQuiz() {
    currentQuiz = 0;
    score = 0;
    document.getElementById('quiz-container').style.display = 'block';
    document.getElementById('quiz-result').style.display = 'none';
    loadQuiz();
  }

  loadQuiz();

  // 3. Flashcards Logic
  let flashcards = [
    { q: "PHOTOSYNTHESIS (प्रकाश संश्लेषण)", a: "पौधों द्वारा सूर्य के प्रकाश से भोजन बनाने की प्रक्रिया।" },
    { q: "NEWTON'S 1ST LAW", a: "वस्तु तब तक विराम या गति में रहेगी जब तक उसपर बाहरी बल न लगे।" },
    { q: "WATER CHEMICAL FORMULA", a: "H2O" }
  ];
  let currentCardIndex = 0;
  let showingQuestion = true;

  function updateFlashcard() {
    if(flashcards.length === 0) {
      document.getElementById('cardContent').textContent = "कोई फ्लैशकार्ड उपलब्ध नहीं है।";
      return;
    }
    const card = flashcards[currentCardIndex];
    document.getElementById('cardContent').textContent = showingQuestion ? card.q : card.a;
  }

  function flipCard() {
    showingQuestion = !showingQuestion;
    updateFlashcard();
  }

  function nextCard() {
    if(flashcards.length === 0) return;
    currentCardIndex = (currentCardIndex + 1) % flashcards.length;
    showingQuestion = true;
    updateFlashcard();
  }

  function prevCard() {
    if(flashcards.length === 0) return;
    currentCardIndex = (currentCardIndex - 1 + flashcards.length) % flashcards.length;
    showingQuestion = true;
    updateFlashcard();
  }

  function addCard() {
    const q = document.getElementById('newCardQ').value;
    const a = document.getElementById('newCardA').value;
    if(q && a) {
      flashcards.push({q, a});
      document.getElementById('newCardQ').value = '';
      document.getElementById('newCardA').value = '';
      alert('फ्लैशकार्ड सफलतापूर्वक जुड़ गया!');
      updateFlashcard();
    } else {
      alert('कृपया दोनों फील्ड भरें।');
    }
  }
  updateFlashcard();

  // 4. Calculator Logic
  let calcInput = "";

  function appendCalc(val) {
    calcInput += val;
    document.getElementById('calcDisplay').textContent = calcInput || "0";
  }

  function clearCalc() {
    calcInput = "";
    document.getElementById('calcDisplay').textContent = "0";
  }

  function calculateResult() {
    try {
      calcInput = eval(calcInput).toString();
      document.getElementById('calcDisplay').textContent = calcInput;
    } catch (e) {
      document.getElementById('calcDisplay').textContent = "अमान्य (Error)";
      calcInput = "";
    }
  }

  // 5. Timetable Logic
  let timetable = JSON.parse(localStorage.getItem('student_timetable')) || [];

  function renderTimetable() {
    const list = document.getElementById('timetableList');
    list.innerHTML = '';
    timetable.forEach((item, index) => {
      list.innerHTML += `
        <div class="list-item">
          <div><strong>${item.time}</strong>: ${item.task}</div>
          <button onclick="deleteTimetable(${index})">✕</button>
        </div>
      `;
    });
    localStorage.setItem('student_timetable', JSON.stringify(timetable));
  }

  function addTimetableItem() {
    const time = document.getElementById('timeInput').value;
    const task = document.getElementById('taskInput').value;
    if(time && task) {
      timetable.push({time, task});
      document.getElementById('timeInput').value = '';
      document.getElementById('taskInput').value = '';
      renderTimetable();
    } else {
      alert('कृपया समय और कार्य दोनों भरें।');
    }
  }

  function deleteTimetable(index) {
    timetable.splice(index, 1);
    renderTimetable();
  }
  renderTimetable();

  // 6. Notes Logic
  let notes = JSON.parse(localStorage.getItem('student_notes')) || [];

  function renderNotes() {
    const list = document.getElementById('notesList');
    list.innerHTML = '';
    notes.forEach((note, index) => {
      list.innerHTML += `
        <div class="list-item" style="flex-direction: column; align-items: flex-start;">
          <div style="display: flex; justify-content: space-width; width: 100%; justify-content: space-between; margin-bottom: 0.25rem;">
            <strong>${note.title}</strong>
            <button onclick="deleteNote(${index})">✕</button>
          </div>
          <p style="font-size: 0.9rem; color: var(--text-muted); white-space: pre-wrap;">${note.content}</p>
        </div>
      `;
    });
    localStorage.setItem('student_notes', JSON.stringify(notes));
  }

  function saveNote() {
    const title = document.getElementById('noteTitle').value;
    const content = document.getElementById('noteContent').value;
    if(title && content) {
      notes.push({title, content});
      document.getElementById('noteTitle').value = '';
      document.getElementById('noteContent').value = '';
      renderNotes();
    } else {
      alert('कृपया शीर्षक और सामग्री दोनों लिखें।');
    }
  }

  function deleteNote(index) {
    notes.splice(index, 1);
    renderNotes();
  }
  renderNotes();
</script>
</body>
</html>
