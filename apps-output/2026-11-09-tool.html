<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>छात्र सहायक (Student Hub)</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --primary: #bb86fc;
            --secondary: #03dac6;
            --text: #e0e0e0;
            --error: #cf6679;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding-bottom: 70px; }
        
        .container { max-width: 600px; margin: auto; padding: 20px; }
        .header { text-align: center; padding: 20px 0; border-bottom: 1px solid #333; }
        
        /* Navigation */
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; z-index: 100; }
        .nav-item { cursor: pointer; text-align: center; font-size: 12px; color: #888; flex: 1; }
        .nav-item.active { color: var(--primary); }
        .nav-item svg { width: 24px; height: 24px; display: block; margin: 0 auto 4px; fill: currentColor; }

        /* Sections */
        .section { display: none; animation: fadeIn 0.3s; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { color: var(--primary); margin-top: 0; }

        /* Timer */
        .timer-display { font-size: 4rem; text-align: center; margin: 20px 0; font-weight: bold; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        button { background: var(--primary); border: none; padding: 10px 20px; border-radius: 5px; color: #000; font-weight: bold; cursor: pointer; }
        button.secondary { background: var(--secondary); }
        button.danger { background: var(--error); color: white; }

        /* Notes & To-do */
        textarea, input { width: 100%; background: #2c2c2c; border: 1px solid #444; color: white; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        .list-item { display: flex; justify-content: space-between; align-items: center; background: #2c2c2c; padding: 10px; border-radius: 5px; margin-bottom: 8px; }

        /* Calculator */
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .calc-screen { grid-column: span 4; background: #000; padding: 15px; text-align: right; font-size: 1.5rem; border-radius: 5px; margin-bottom: 10px; min-height: 50px; }

        /* Flashcards */
        .flashcard { perspective: 1000px; height: 200px; cursor: pointer; }
        .flashcard-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 1.2rem; padding: 20px; text-align: center; }
        .front { background: #333; border: 2px solid var(--primary); }
        .back { background: var(--primary); color: #000; transform: rotateY(180deg); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>छात्र सहायक</h1>
        <p id="current-date"></p>
    </div>

    <!-- Timer Section -->
    <div id="timer" class="section active">
        <div class="card">
            <h2>⏱️ पढ़ाई टाइमर</h2>
            <div class="timer-display" id="time-left">25:00</div>
            <div class="btn-group">
                <button onclick="toggleTimer()" id="timer-btn">शुरू करें</button>
                <button class="secondary" onclick="resetTimer()">रीसेट</button>
            </div>
        </div>
    </div>

    <!-- Notes Section -->
    <div id="notes" class="section">
        <div class="card">
            <h2>📝 मेरे नोट्स</h2>
            <textarea id="note-input" rows="5" placeholder="यहाँ कुछ लिखें..."></textarea>
            <button onclick="saveNote()">नोट सेव करें</button>
            <div id="saved-notes" style="margin-top: 15px;"></div>
        </div>
    </div>

    <!-- Tasks Section -->
    <div id="tasks" class="section">
        <div class="card">
            <h2>✅ टू-डू लिस्ट</h2>
            <div style="display:flex; gap:5px;">
                <input type="text" id="task-input" placeholder="नया काम जोड़ें...">
                <button onclick="addTask()">+</button>
            </div>
            <div id="task-list"></div>
        </div>
    </div>

    <!-- Calculator Section -->
    <div id="calc" class="section">
        <div class="card">
            <h2>🔢 कैलकुलेटर</h2>
            <div class="calc-screen" id="calc-display">0</div>
            <div class="calc-grid">
                <button class="danger" onclick="calcClear()">C</button>
                <button class="secondary" onclick="calcInput('/')">÷</button>
                <button class="secondary" onclick="calcInput('*')">×</button>
                <button class="secondary" onclick="calcInput('-')">-</button>
                <button onclick="calcInput('7')">7</button>
                <button onclick="calcInput('8')">8</button>
                <button onclick="calcInput('9')">9</button>
                <button class="secondary" onclick="calcInput('+')">+</button>
                <button onclick="calcInput('4')">4</button>
                <button onclick="calcInput('5')">5</button>
                <button onclick="calcInput('6')">6</button>
                <button class="secondary" onclick="calcSolve()">=</button>
                <button onclick="calcInput('1')">1</button>
                <button onclick="calcInput('2')">2</button>
                <button onclick="calcInput('3')">3</button>
                <button onclick="calcInput('0')">0</button>
            </div>
        </div>
    </div>

    <!-- Flashcards Section -->
    <div id="flash" class="section">
        <div class="card">
            <h2>💡 फ्लैशकार्ड्स</h2>
            <div class="flashcard" onclick="this.classList.toggle('flipped')">
                <div class="flashcard-inner">
                    <div class="front" id="fc-front">प्रश्न देखने के लिए क्लिक करें</div>
                    <div class="back" id="fc-back">उत्तर यहाँ दिखेगा</div>
                </div>
            </div>
            <div class="btn-group" style="margin-top:20px;">
                <button class="secondary" onclick="prevFlashcard()">पीछे</button>
                <button onclick="nextFlashcard()">अगला</button>
            </div>
        </div>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-item active" onclick="showSection('timer', this)">
        <svg viewBox="0 0 24 24"><path d="M12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22C6.47,22 2,17.5 2,12A10,10 0 0,1 12,2M12.5,7V12.25L17,14.92L16.25,16.15L11,13V7H12.5Z" /></svg>
        टाइमर
    </div>
    <div class="nav-item" onclick="showSection('notes', this)">
        <svg viewBox="0 0 24 24"><path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" /></svg>
        नोट्स
    </div>
    <div class="nav-item" onclick="showSection('tasks', this)">
        <svg viewBox="0 0 24 24"><path d="M19,3H14.82C14.4,1.84 13.3,1 12,1C10.7,1 9.6,1.84 9.18,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M12,3A1,1 0 0,1 13,4A1,1 0 0,1 12,5A1,1 0 0,1 11,4A1,1 0 0,1 12,3M14,17H7V15H14V17M17,13H7V11H17V13M17,9H7V7H17V9Z" /></svg>
        टू-डू
    </div>
    <div class="nav-item" onclick="showSection('calc', this)">
        <svg viewBox="0 0 24 24"><path d="M7,2H17A2,2 0 0,1 19,4V20A2,2 0 0,1 17,22H7A2,2 0 0,1 5,20V4A2,2 0 0,1 7,2M7,4V8H17V4H7M7,10V12H9V10H7M11,10V12H13V10H11M15,10V12H17V10H15M7,14V16H9V14H7M11,14V16H13V14H11M15,14V18H17V14H15M7,18V20H9V18H7M11,18V20H13V18H11Z" /></svg>
        कैलकुलेटर
    </div>
    <div class="nav-item" onclick="showSection('flash', this)">
        <svg viewBox="0 0 24 24"><path d="M21,16.5C21,16.88 20.79,17.21 20.47,17.38L12.57,21.82C12.41,21.94 12.21,22 12,22C11.79,22 11.59,21.94 11.43,21.82L3.53,17.38C3.21,17.21 3,16.88 3,16.5V7.5C3,7.12 3.21,6.79 3.53,6.62L11.43,2.18C11.59,2.06 11.79,2 12,2C12.21,2 12.41,2.06 12.57,2.18L20.47,6.62C20.79,6.79 21,7.12 21,7.5V16.5Z" /></svg>
        कार्ड्स
    </div>
</nav>

<script>
    // Navigation
    function showSection(id, el) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    }

    // Date
    const d = new Date();
    const days = ["रविवार", "सोमवार", "मंगलवार", "बुधवार", "गुरुवार", "शुक्रवार", "शनिवार"];
    document.getElementById('current-date').innerText = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} - ${days[d.getDay()]}`;

    // Timer Logic
    let timeLeft = 25 * 60;
    let timerId = null;
    function updateTimerDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        document.getElementById('time-left').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }
    function toggleTimer() {
        if (timerId) {
            clearInterval(timerId);
            timerId = null;
            document.getElementById('timer-btn').innerText = "शुरू करें";
        } else {
            timerId = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerId);
                    alert("समय समाप्त! थोड़ा ब्रेक लें।");
                }
            }, 1000);
            document.getElementById('timer-btn').innerText = "रोकें";
        }
    }
    function resetTimer() {
        clearInterval(timerId);
        timerId = null;
        timeLeft = 25 * 60;
        updateTimerDisplay();
        document.getElementById('timer-btn').innerText = "शुरू करें";
    }

    // Notes Logic
    function saveNote() {
        const note = document.getElementById('note-input').value;
        if (!note) return;
        const notes = JSON.parse(localStorage.getItem('student_notes') || '[]');
        notes.unshift({ text: note, date: new Date().toLocaleTimeString() });
        localStorage.setItem('student_notes', JSON.stringify(notes));
        document.getElementById('note-input').value = '';
        displayNotes();
    }
    function displayNotes() {
        const notes = JSON.parse(localStorage.getItem('student_notes') || '[]');
        document.getElementById('saved-notes').innerHTML = notes.map((n, i) => `
            <div class="list-item" style="flex-direction:column; align-items:start;">
                <small>${n.date}</small>
                <p style="margin:5px 0;">${n.text}</p>
                <button class="danger" style="padding:2px 8px; font-size:10px;" onclick="deleteNote(${i})">मिटाएँ</button>
            </div>
        `).join('');
    }
    function deleteNote(i) {
        const notes = JSON.parse(localStorage.getItem('student_notes'));
        notes.splice(i, 1);
        localStorage.setItem('student_notes', JSON.stringify(notes));
        displayNotes();
    }

    // Tasks Logic
    function addTask() {
        const input = document.getElementById('task-input');
        if (!input.value) return;
        const tasks = JSON.parse(localStorage.getItem('student_tasks') || '[]');
        tasks.push(input.value);
        localStorage.setItem('student_tasks', JSON.stringify(tasks));
        input.value = '';
        displayTasks();
    }
    function displayTasks() {
        const tasks = JSON.parse(localStorage.getItem('student_tasks') || '[]');
        document.getElementById('task-list').innerHTML = tasks.map((t, i) => `
            <div class="list-item">
                <span>${t}</span>
                <button class="danger" style="padding:5px;" onclick="deleteTask(${i})">✓</button>
            </div>
        `).join('');
    }
    function deleteTask(i) {
        const tasks = JSON.parse(localStorage.getItem('student_tasks'));
        tasks.splice(i, 1);
        localStorage.setItem('student_tasks', JSON.stringify(tasks));
        displayTasks();
    }

    // Calculator Logic
    let calcVal = "";
    function calcInput(v) { 
        calcVal += v; 
        document.getElementById('calc-display').innerText = calcVal; 
    }
    function calcClear() { 
        calcVal = ""; 
        document.getElementById('calc-display').innerText = "0"; 
    }
    function calcSolve() {
        try {
            calcVal = eval(calcVal).toString();
            document.getElementById('calc-display').innerText = calcVal;
        } catch {
            document.getElementById('calc-display').innerText = "Error";
            calcVal = "";
        }
    }

    // Flashcards Logic
    const flashcards = [
        { q: "भारतीय संविधान के जनक कौन हैं?", a: "डॉ. बी.आर. अंबेडकर" },
        { q: "प्रकाश संश्लेषण (Photosynthesis) क्या है?", a: "पौधों द्वारा सूर्य के प्रकाश से भोजन बनाने की प्रक्रिया" },
        { q: "H2O का रासायनिक नाम क्या है?", a: "पानी (Water)" },
        { q: "सबसे छोटा अभाज्य संख्या (Prime Number) कौन सा है?", a: "2" }
    ];
    let currentFC = 0;
    function updateFC() {
        const card = document.querySelector('.flashcard');
        card.classList.remove('flipped');
        setTimeout(() => {
            document.getElementById('fc-front').innerText = flashcards[currentFC].q;
            document.getElementById('fc-back').innerText = flashcards[currentFC].a;
        }, 200);
    }
    function nextFlashcard() {
        currentFC = (currentFC + 1) % flashcards.length;
        updateFC();
    }
    function prevFlashcard() {
        currentFC = (currentFC - 1 + flashcards.length) % flashcards.length;
        updateFC();
    }

    // Initialize
    displayNotes();
    displayTasks();
    updateFC();
</script>

</body>
</html>
