name: Hindi voice cache

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice-cache
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps
        run: pip install -q -r requirements.txt

      - name: Fill missing Hindi lines
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python fill_voice.py

      - name: Commit new voice lines
        run: |
          git config user.name "ai-employee"
          git config user.email "actions@github.com"
          git add assets/dub
          if git diff --cached --quiet; then
            echo "no new lines"
            exit 0
          fi
          git commit -m "cache hindi voice $(date -u +%F)"
          for attempt in 1 2 3; do
            git rebase --abort >/dev/null 2>&1 || true
            if git pull --rebase origin main && git push; then
              echo "pushed"
              exit 0
            fi
          done
          echo "push failed after 3 attempts"
          exit 1
