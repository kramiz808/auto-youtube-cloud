name: Daily Hindi story (20-25 min)

on:
  schedule:
    - cron: '0 13,14,16,17 * * *'
    - cron: '5 7,8,9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-content
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps
        run: pip install -q -r requirements.txt

      - name: Restore ElevenLabs audio cache
        uses: actions/cache/restore@v4
        with:
          path: work/elevenlabs
          key: elevenlabs-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: elevenlabs-v1-${{ runner.os }}-

      - name: Write story, narrate, render, upload
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python story.py

      - name: Save ElevenLabs audio cache
        if: always() && hashFiles('work/elevenlabs/*.mp3') != ''
        uses: actions/cache/save@v4
        with:
          path: work/elevenlabs
          key: elevenlabs-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload story artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-story
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit state
        if: always()
        run: |
          git config user.name "ai-employee"
          git config user.email "actions@github.com"
          if [ -f story_state.json ]; then git add story_state.json; fi
          if [ -f output/stories.txt ]; then git add output/stories.txt; fi
          git add output/episode-*.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "daily story $(date -u +%F)"
          for attempt in 1 2 3; do
            git rebase --abort >/dev/null 2>&1 || true
            if git pull --rebase origin main && git push; then
              echo "pushed"
              exit 0
            fi
          done
          echo "push failed after 3 attempts"
          exit 1
