name: Daily Hindi story (20-25 min)

on:
  schedule:
    - cron: '0 15-17 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps
        run: pip install -q -r requirements.txt

      - name: Write story, narrate, render, upload
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python story.py

      - name: Upload story artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-story
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit state
        if: always()
        run: |
          git config user.name "ai-employee"
          git config user.email "actions@github.com"
          git add state.json
          if [ -f output/stories.txt ]; then git add output/stories.txt; fi
          git diff --cached --quiet && exit 0
          git commit -m "daily story $(date -u +%F)"
          git pull --rebase origin main
          git push
