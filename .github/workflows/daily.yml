name: Daily AI Employee

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the slot guard and post now'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-content
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Posting window check
        id: win
        run: |
          hh=$(TZ=Asia/Kolkata date +%H)
          echo "IST hour: $hh"
          echo "hour=$hh" >> "$GITHUB_OUTPUT"
          if [ "$hh" -ge 6 ] && [ "$hh" -le 20 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.win.outputs.due == 'true' || inputs.force == true

      - uses: actions/setup-python@v5
        if: steps.win.outputs.due == 'true' || inputs.force == true
        with:
          python-version: '3.12'

      - name: Ensure ffmpeg
        if: steps.win.outputs.due == 'true' || inputs.force == true
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Install Python deps
        if: steps.win.outputs.due == 'true' || inputs.force == true
        run: pip install -q -r requirements.txt

      - name: Restore TTS audio cache
        if: steps.win.outputs.due == 'true' || inputs.force == true
        uses: actions/cache/restore@v4
        with:
          path: |
            work/elevenlabs
            work/edge
          key: tts-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tts-v1-${{ runner.os }}-

      - name: Run daily pipeline
        timeout-minutes: 25
        if: steps.win.outputs.due == 'true' || inputs.force == true
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          TEXT_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          TTS_PROVIDER: edge
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python -u daily.py

      - name: Run daily Hindi story (after 6 PM IST)
        timeout-minutes: 75
        if: always() && steps.win.outputs.due == 'true' && steps.win.outputs.hour >= 18
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          TEXT_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          TTS_PROVIDER: edge
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python -u story.py

      - name: Save TTS audio cache
        if: always() && hashFiles('work/elevenlabs/*.mp3', 'work/edge/*.mp3') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            work/elevenlabs
            work/edge
          key: tts-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload video artifact
        if: always() && (steps.win.outputs.due == 'true' || inputs.force == true)
        uses: actions/upload-artifact@v4
        with:
          name: daily-video
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit state back
        if: always() && (steps.win.outputs.due == 'true' || inputs.force == true)
        run: |
          git config user.name "ai-employee"
          git config user.email "actions@github.com"
          for path in state.json story_state.json quota.json today.json output/posts.txt output/log.txt output/stories.txt; do
            if [ -f "$path" ]; then git add -- "$path"; fi
          done
          git add -- output/episode-*.json apps-output/*.html 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "daily run $(date -u +%F)"
          for attempt in 1 2 3; do
            git rebase --abort >/dev/null 2>&1 || true
            if git pull --rebase origin main && git push; then
              echo "pushed"
              exit 0
            fi
          done
          echo "push failed after 3 attempts"
          exit 1
